<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in | AIHS Library</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Manrope:wght@500;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="app.css"></head>
<body><div class="center"><main class="panel" style="text-align:center">
<img src="logo.jpg" alt="AIHS" width="90" style="border-radius:50%;background:#fff">
<h1>Sign in</h1><p>One login for students, staff and admin. You will land on the right page automatically.</p>
<button class="g" id="g" type="button">Continue with Google</button><p class="msg" id="m"></p>
<p><a href="register.html"><b>New here? Self registration</b></a> &middot; <a href="index.html">Home</a></p></main></div>
<script type="module">
import {auth,google,profile,go,onAuthStateChanged} from "./fb.js";
const m=document.getElementById("m");
async function route(u){const p=await profile(u),n=sessionStorage.getItem("next");if(n&&p&&p.status==="approved"){sessionStorage.removeItem("next");location.href=n;return;}location.href=go(p);}
onAuthStateChanged(auth,u=>{if(u)route(u);});
document.getElementById("g").onclick=async()=>{try{await route(await google());}catch(e){if(e.code!=="auth/popup-closed-by-user"){m.className="msg err";m.textContent=e.code==="auth/unauthorized-domain"?"Add this website's domain in Firebase > Authentication > Settings > Authorized domains.":"Sign in failed: "+(e.code||e.message);}}};
</script></body></html>
