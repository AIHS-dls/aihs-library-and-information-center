
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | AIHS Digital Library</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #102b50, #176b87);
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      padding: 36px 28px;
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 15px 45px rgba(0, 0, 0, 0.25);
      text-align: center;
    }

    .logo {
      width: 82px;
      height: 82px;
      object-fit: contain;
      margin-bottom: 12px;
    }

    h1 {
      color: #12345a;
      font-size: 25px;
      margin: 8px 0;
    }

    .subtitle {
      color: #667085;
      line-height: 1.5;
      margin-bottom: 26px;
    }

    .google-button {
      width: 100%;
      padding: 13px 16px;
      border: 1px solid #d0d5dd;
      border-radius: 9px;
      background: #fff;
      color: #222;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    .google-button:hover {
      background: #f5f7fa;
    }

    .google-button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #message {
      margin-top: 18px;
      font-size: 14px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .back-link, .register-link {
      display: inline-block;
      margin-top: 20px;
      color: #176b87;
      text-decoration: none;
      font-size: 14px;
    }

    .register-link {
      margin-left: 12px;
    }

    footer {
      margin-top: 26px;
      color: #667085;
      font-size: 12px;
    }
  </style>
</head>

<body>
  <main class="login-card">
    <img
      class="logo"
      src="images/logo.jpg"
      alt="AIHS Digital Library Logo"
      onerror="this.style.display='none'"
    >

    <h1>AIHS Digital Library</h1>
    <p class="subtitle">
      Sign in with your authorized Google account to continue.
    </p>

    <button id="googleSignIn" class="google-button" type="button">
      Continue with Google
    </button>

    <p id="message" role="status" aria-live="polite"></p>

    <a class="back-link" href="index.html">Back to Home</a>
    <a class="register-link" href="register.html">Self Registration</a>

    <footer>AIHS Digital Library</footer>
  </main>

  <script type="module">
    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";

    import {
      getAuth,
      GoogleAuthProvider,
      signInWithPopup
    } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";

    import {
      getFirestore,
      doc,
      getDoc
    } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBjRud7T49JmDfhkwUrNLeY1IcvXqW_W1Y",
      authDomain: "aihs-digital-library.firebaseapp.com",
      projectId: "aihs-digital-library",
      storageBucket: "aihs-digital-library.firebasestorage.app",
      messagingSenderId: "1032446713158",
      appId: "1:1032446713158:web:4f679abd8787cc759e9947"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    const button = document.getElementById("googleSignIn");
    const message = document.getElementById("message");

    button.addEventListener("click", async () => {
      button.disabled = true;
      message.style.color = "#344054";
      message.textContent = "Signing in...";

      try {
        const result = await signInWithPopup(auth, provider);
        const user = result.user;

        // Only an administrator-created users/{uid} document
        // with an approved role grants dashboard access.
        const userRef = doc(db, "users", user.uid);
        const userSnap = await getDoc(userRef);

        if (!userSnap.exists()) {
          message.style.color = "#b42318";
          message.textContent =
            "Your account is not approved. Please contact the library administrator.";
          await auth.signOut();
          return;
        }

        const profile = userSnap.data();
        const role = String(profile.role || "").toLowerCase();

        const dashboards = {
          admin: "admin-dashboard.html",
          staff: "staff-dashboard.html",
          student: "student-dashboard.html"
        };

        if (!dashboards[role]) {
          message.style.color = "#b42318";
          message.textContent =
            "Your account does not have an authorized role. Contact the administrator.";
          await auth.signOut();
          return;
        }

        window.location.href = dashboards[role];

      } catch (error) {
        console.error(error);
        message.style.color = "#b42318";

        if (error.code === "auth/popup-closed-by-user") {
          message.textContent = "Sign-in was cancelled. Please try again.";
        } else if (error.code === "permission-denied" ||
                   error.code === "firestore/permission-denied") {
          message.textContent =
            "Access denied. Please ask the administrator to check Firestore permissions.";
        } else {
          message.textContent =
            "Sign-in failed. Check your internet connection and Firebase settings.";
        }
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
