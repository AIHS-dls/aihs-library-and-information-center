<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#041a31"><title>Sign in | AIHS Library</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Manrope:wght@500;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="app.css"></head>
<body><div class="center bg-login"><main class="panel">
<div class="brand"><img src="logo.jpg" alt="AIHS"><span class="eyebrow">AIHS Library &amp; Information Center</span><h1>Welcome back</h1><p>Sign in with your registered User ID and password.</p></div>
<form id="f" novalidate>
<label for="i">User ID <span style="font-weight:600;color:#5b6b75">(College ID, or email for admin)</span></label><input id="i" autocomplete="username" autocapitalize="none" spellcheck="false" required>
<label for="p">Password</label><div class="pw"><input id="p" type="password" autocomplete="current-password" required><button type="button" id="t" aria-label="Show password">Show</button></div>
<p style="margin:22px 0 0"><button class="btn" id="b" style="width:100%;padding:15px;font-size:14px">Sign in</button></p></form>
<p class="msg" id="m" role="alert"></p>
<p class="links"><a href="register.html">New here? Register</a> &middot; <a href="index.html">Home</a><small>Forgot your password? Please contact the librarian.</small></p>
</main></div>
<script type="module">
import {auth,login,profile,go,onAuthStateChanged} from "./fb.js";
const $=id=>document.getElementById(id),m=$("m"),b=$("b");
$("t").onclick=()=>{const s=$("p").type==="password";$("p").type=s?"text":"password";$("t").textContent=s?"Hide":"Show";};
async function route(u){
  const p=await profile(u);
  if(!p){
    m.className="msg err";
    m.textContent="Your account profile was not found. Please contact the librarian to verify your account.";
    return;
  }
  const n=sessionStorage.getItem("next");
  if(n&&p.status==="approved"){sessionStorage.removeItem("next");location.href=n;return;}
  location.href=go(p);
}
onAuthStateChanged(auth,u=>{if(u)route(u);});
$("f").onsubmit=async e=>{
  e.preventDefault();
  const id=$("i").value.trim(),pw=$("p").value;
  if(!id||!pw){m.className="msg err";m.textContent="Please enter your User ID and password.";return;}
  m.className="msg";m.textContent="";b.disabled=true;b.innerHTML='<span class="sp-ring"></span>Signing in...';
  try{await login(id,pw);}
  catch(err){
    b.disabled=false;b.textContent="Sign in";m.className="msg err";
    const c=err.code;
    m.textContent=["auth/invalid-credential","auth/wrong-password","auth/user-not-found","auth/invalid-email"].includes(c)?"Wrong User ID or password. Please check and try again.":c==="auth/operation-not-allowed"?"Email/Password sign-in is not enabled in Firebase yet.":c==="auth/too-many-requests"?"Too many attempts. Please wait a few minutes and try again.":c==="auth/network-request-failed"?"No internet connection. Please try again.":"Login failed: "+(c||err.message);
  }
};
</script></body></html>
