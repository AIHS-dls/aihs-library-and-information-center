<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#092d43"><title>AIHS Library Attendance</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700;800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:28px 16px;display:grid;place-items:center;background:radial-gradient(circle at 15% 10%,#1c6b70,transparent 35%),linear-gradient(135deg,#071f33,#103c50);font-family:Manrope,Arial,sans-serif;color:#20313a}.panel{width:min(100%,570px);padding:34px;border-radius:25px;background:#fff;box-shadow:0 28px 80px #00152266;text-align:center}.logo{width:78px;height:78px;object-fit:contain;border-radius:50%;border:2px solid #e6ad42;padding:3px}.kicker{margin:18px 0 5px;color:#a77c35;font-size:11px;font-weight:900;letter-spacing:2px}h1{margin:0;color:#092d43;font:800 clamp(27px,6vw,36px) Fraunces,Georgia,serif}.intro{color:#64747a;font-size:14px;line-height:1.7}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:25px 0;text-align:left}.field{padding:15px;border:1px solid #e1e9e7;border-radius:13px;background:#f8faf9}.field span{display:block;color:#748187;font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase}.field b{display:block;margin-top:5px;color:#12394b;font-size:14px;overflow-wrap:anywhere}.status{padding:16px;border-radius:13px;background:#edf6f2;color:#176b55;font-weight:800;font-size:14px;line-height:1.7}.err{background:#fff0ee;color:#a23a30}a{color:#147d78;font-weight:800;text-decoration:none}@media(max-width:480px){.panel{padding:25px 18px}.field{padding:12px}.field b{font-size:12px}}
</style></head><body><main class="panel"><img class="logo" src="logo.jpg" alt="AIHS Library"><div class="kicker">AIHS LIBRARY &amp; INFORMATION CENTER</div><h1>Student Entry &amp; Exit</h1><p class="intro">ಅನುಮೋದಿತ ಖಾತೆಯಿಂದ ಲಾಗಿನ್ ಮಾಡಿ. ಮೊದಲ QR ಸ್ಕ್ಯಾನ್ Entry, ಎರಡನೇ QR ಸ್ಕ್ಯಾನ್ Out ಸಮಯ ದಾಖಲಿಸುತ್ತದೆ.</p><div id="result">Checking your account...</div><p style="margin-top:22px"><a href="index.html">← Back to Library Website</a></p></main>
<script type="module">
import {auth,db,profile,doc,getDoc,setDoc,updateDoc,serverTimestamp,onAuthStateChanged,esc} from "./fb.js";
const root=document.getElementById("result"),key=new URLSearchParams(location.search).get("k")||"";
const f=(label,value)=>'<div class="field"><span>'+label+'</span><b>'+esc(value||"Not set")+'</b></div>';
const show=(msg,cls="status",fields="")=>{root.innerHTML=(fields?'<div class="fields">'+fields+'</div>':'')+'<div class="'+cls+'">'+msg+'</div>';};
onAuthStateChanged(auth,async user=>{if(!user){sessionStorage.setItem("next",location.href);location.href="login.html";return;}try{
const p=await profile(user);if(!p){location.href="register.html";return;}if(p.status!=="approved"){show("ನಿಮ್ಮ ಖಾತೆಗೆ ಇನ್ನೂ ಅನುಮತಿ ದೊರೆತಿಲ್ಲ. Admin approval ನಂತರ ಪ್ರಯತ್ನಿಸಿ.","status err");return;}
const now=new Date(),date=new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Kolkata",year:"numeric",month:"2-digit",day:"2-digit"}).format(now),ref=doc(db,"attendance",user.uid+"_"+date),s=await getDoc(ref),base=f("Name",p.name)+f("Department",p.dept)+f("Class",p.cls);
if(!s.exists()){await setDoc(ref,{uid:user.uid,date,name:p.name,idNo:p.idNo||"",dept:p.dept||"",cls:p.cls||"",role:p.role||"student",key,ts:serverTimestamp(),entryAt:serverTimestamp(),outAt:null});show("Entry ಸಮಯ ಯಶಸ್ವಿಯಾಗಿ ದಾಖಲಿಸಲಾಗಿದೆ. ಹೊರಡುವಾಗ ಇದೇ QR ಅನ್ನು ಮತ್ತೆ ಸ್ಕ್ಯಾನ್ ಮಾಡಿ.","status",base+f("Entry Date",date)+f("Entry Time",now.toLocaleTimeString("en-IN"))+f("Out Date","Pending")+f("Out Time","Pending"));}
else{const d=s.data();if(d.outAt){show("ಇಂದಿನ Entry ಮತ್ತು Out ಎರಡೂ ಈಗಾಗಲೇ ದಾಖಲಾಗಿವೆ.","status",base+f("Entry Date",d.date)+f("Entry Time",d.entryAt?.toDate?.().toLocaleTimeString("en-IN"))+f("Out Date",d.outAt.toDate().toLocaleDateString("en-IN"))+f("Out Time",d.outAt.toDate().toLocaleTimeString("en-IN")));}
else{await updateDoc(ref,{outAt:serverTimestamp()});show("Out ಸಮಯ ಯಶಸ್ವಿಯಾಗಿ ದಾಖಲಿಸಲಾಗಿದೆ. ಧನ್ಯವಾದಗಳು!","status",base+f("Entry Date",d.date)+f("Entry Time",d.entryAt?.toDate?.().toLocaleTimeString("en-IN")||"Recorded")+f("Out Date",date)+f("Out Time",now.toLocaleTimeString("en-IN")));}}
}catch(e){show("Attendance ಉಳಿಸಲಾಗಲಿಲ್ಲ. Firestore Rules ನಲ್ಲಿ attendance create/update ಅನುಮತಿ ಪರಿಶೀಲಿಸಿ. "+(e.code||""),"status err");}});
</script></body></html>
