<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Registration | AIHS Library</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Manrope:wght@500;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="app.css"></head>
<body><div class="center bg-reg"><main class="panel">
<div style="text-align:center"><img src="logo.jpg" alt="AIHS" width="90" style="border-radius:50%;background:#fff"><h1>Registration</h1></div><p style="margin-top:0">Your College ID will be your User ID. The librarian approves your account before you can open resources.</p>
<form id="f">
<label>Register as</label><div class="roles"><label><input type="radio" name="role" value="student" checked> Student</label><label><input type="radio" name="role" value="staff"> Staff</label></div>
<label for="name">Full name</label><input id="name" required>
<div class="row"><div><label for="dept">Department</label><select id="dept" required><option value="">Select</option><option>BPT (Physiotherapy)</option><option>BMLT (Medical Laboratory)</option><option>BMIT (Medical Imaging)</option><option>MHA (Hospital Administration)</option><option>Library / Office</option><option>Other</option></select></div>
<div><label for="cls">Class</label><select id="cls" required><option value="">Select</option><option>1st Year</option><option>2nd Year</option><option>3rd Year</option><option>4th Year</option><option>Internship</option><option>PG 1st Year</option><option>PG 2nd Year</option><option>Not applicable</option></select></div></div>
<label for="idNo">College ID Number (your User ID)</label><input id="idNo" autocomplete="username" required>
<label for="email">Email ID (for confirmation message)</label><input id="email" type="email" required>
<div class="row"><div><label for="pw">Password (min 6)</label><input id="pw" type="password" minlength="6" autocomplete="new-password" required></div>
<div><label for="pw2">Confirm password</label><input id="pw2" type="password" minlength="6" autocomplete="new-password" required></div></div>
<p style="margin-top:20px"><button class="btn" style="width:100%;padding:14px">Register</button></p></form>
<p class="msg" id="m"></p><p style="text-align:center"><a href="login.html">Already registered? Login</a> &middot; <a href="index.html">Home</a></p>
</main></div>
<script type="module">
import {auth,db,signup,idEmail,go,doc,setDoc,serverTimestamp,mail} from "./fb.js";
const $=id=>document.getElementById(id);
$("f").onsubmit=async e=>{
  e.preventDefault();const m=$("m");m.className="msg";m.textContent="";
  if($("pw").value!==$("pw2").value){m.className="msg err";m.textContent="Passwords do not match.";return;}
  const idNo=$("idNo").value.trim();
  try{
    const c=await signup(idNo,$("pw").value);
    const d={name:$("name").value.trim(),dept:$("dept").value,cls:$("cls").value,idNo,authEmail:idEmail(idNo),email:$("email").value.trim(),role:document.querySelector("input[name=role]:checked").value,status:"pending",createdAt:serverTimestamp()};
    await setDoc(doc(db,"users",c.user.uid),d);
    mail("registered");
    location.href=go(d);
  }catch(err){
    m.className="msg err";
    m.textContent=err.code==="auth/email-already-in-use"?"This College ID is already registered. Please login.":err.code==="auth/weak-password"?"Password must be at least 6 characters.":err.code==="auth/operation-not-allowed"?"Email/Password sign-in is not enabled in Firebase yet.":"Registration failed: "+(err.code||err.message);
  }
};
</script></body></html>
