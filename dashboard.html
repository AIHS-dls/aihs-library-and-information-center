<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Library | AIHS</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Manrope:wght@500;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="app.css"></head>
<body><div class="top"><img src="logo.jpg" alt=""><div><b>AIHS Library</b><small id="who"></small></div><span class="sp"></span><a href="index.html" class="btn">Home</a> <button class="out" id="out">Sign out</button></div>
<div class="wrap"><div class="panel" id="box">Loading...</div>
<div class="panel" style="margin-top:18px"><h2>Change password</h2><form id="pf"><div class="row"><div><label for="cp">Current password</label><input id="cp" type="password" required></div><div><label for="np">New password (min 6)</label><input id="np" type="password" minlength="6" required></div></div><p style="margin-top:14px"><button class="btn">Change password</button></p><p class="msg" id="pm"></p></form></div></div>
<script type="module">
import {auth,db,profile,go,signOut,onAuthStateChanged,collection,onSnapshot,esc,changePassword} from "./fb.js";
const $=id=>document.getElementById(id);
$("out").onclick=async()=>{await signOut(auth);location.href="index.html";};
$("pf").onsubmit=async e=>{e.preventDefault();const m=$("pm");m.className="msg";m.textContent="";
  try{await changePassword($("cp").value,$("np").value);m.className="msg ok";m.textContent="Password changed.";$("pf").reset();}
  catch(err){m.className="msg err";m.textContent=err.code==="auth/invalid-credential"||err.code==="auth/wrong-password"?"Current password is wrong.":"Could not change password: "+(err.code||err.message);}};
onAuthStateChanged(auth,async u=>{
  if(!u){location.href="index.html";return;}
  const p=await profile(u);if(!p){location.href="register.html";return;}
  if(go(p)==="admin.html"){location.href="admin.html";return;}
  $("who").textContent=p.name+" - "+p.role;
  const b=$("box");
  if(p.status==="pending"){b.innerHTML="<h2>Waiting for approval</h2><p>Your registration is with the library admin. You can open resources once it is approved. Please check again later.</p><span class='badge pending'>Pending</span>";return;}
  if(p.status==="rejected"){b.innerHTML="<h2>Registration not approved</h2><p>Please contact the librarian: librarian@aihs.ac.in</p><span class='badge rejected'>Rejected</span>";return;}
  b.innerHTML="<h2>Welcome, "+esc(p.name)+"</h2><p style='margin:0 0 6px;color:#5b6b75'>"+esc(p.dept)+" &middot; "+esc(p.cls)+" &middot; ID "+esc(p.idNo)+"</p><div class='tabs' id='ct'></div><input id='rq' placeholder='Search e-books, notes, question papers, journals' style='margin-bottom:6px'><div class='grid2' id='gr'></div>";
  const CATS=["All","E-Books","Study Notes","Question Papers","eJournals"];let cat="All",list=[],links={};
  function draw(){
    const ct=$("ct");ct.innerHTML="";
    CATS.forEach(c=>{const x=document.createElement("button");x.textContent=c;x.className=c===cat?"on":"";x.onclick=()=>{cat=c;draw();};ct.appendChild(x);});
    const q=$("rq").value.toLowerCase(),g=$("gr");
    const v=list.filter(r=>(cat==="All"||r.category===cat)&&(r.title+(r.desc||"")+r.dept+r.cls).toLowerCase().includes(q)).sort((a,b)=>a.title.localeCompare(b.title));
    g.innerHTML=v.length?"":"<p style='color:#5b6b75'>No resources found.</p>";
    v.forEach(r=>{
      const l=links[r.id]||"",ok=/^https:\/\/(drive|docs)\.google\.com\//.test(l);
      const d=document.createElement("div");d.className="rc";
      d.innerHTML="<span class='cat'>"+esc(r.category)+"</span><h3>"+esc(r.title)+"</h3><p>"+esc(r.dept)+" &middot; "+esc(r.cls)+"</p>"+(r.desc?"<p>"+esc(r.desc)+"</p>":"")+(ok?"<a target='_blank' rel='noopener' href='"+esc(l)+"'>Open</a>":"");
      g.appendChild(d);
    });
  }
  $("rq").oninput=draw;
  onSnapshot(collection(db,"resources"),s=>{list=s.docs.map(d=>({id:d.id,...d.data()}));draw();});
  onSnapshot(collection(db,"resourceLinks"),s=>{links={};s.docs.forEach(d=>{links[d.id]=d.data().link;});draw();});
});
</script></body></html>
