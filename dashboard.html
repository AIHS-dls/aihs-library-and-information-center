<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Library | AIHS</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Manrope:wght@500;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="app.css">
<style>
/* Student / Staff dashboard improvements */
/* Full dashboard content section: wider and roomier */
.wrap{width:96%;max-width:1680px;margin:24px auto 40px;}
#box{width:100%;min-height:850px;padding:48px 52px;border-radius:24px;box-shadow:0 12px 36px rgba(6,40,71,.12);}
#box>#resourceResults{width:100%;}
#box>.tabs{margin-top:28px;margin-bottom:24px;gap:14px;}
#box>#rq{min-height:54px;padding:16px 20px;font-size:16px;border-radius:13px;}
#box>#deptFilters{margin:18px 0 24px;gap:10px;}
.resource-section{width:100%;box-sizing:border-box;background:#f8fafb;border:1px solid #dce6eb;border-radius:20px;padding:26px 28px;margin:30px 0 34px;box-shadow:0 5px 18px rgba(6,40,71,.06);}
.resource-section h2{font-size:27px;margin:0 0 18px;padding:0 0 14px;border-bottom:2px solid #dce6eb;color:#062847;}
.book-grid{grid-template-columns:repeat(6,minmax(0,1fr));gap:18px;margin:18px 0 8px;}
#box>.tabs{margin-top:24px;margin-bottom:20px;gap:12px;}
#box>#rq{min-height:50px;padding:14px 18px;font-size:15px;border-radius:12px;}
#box>#resourceResults{margin-top:24px;}
@media(max-width:1400px){.book-grid{grid-template-columns:repeat(5,minmax(0,1fr));}}
@media(max-width:1150px){.book-grid{grid-template-columns:repeat(4,minmax(0,1fr));}}
@media(max-width:900px){.wrap{width:98%;}.book-grid{grid-template-columns:repeat(3,minmax(0,1fr));}#box{min-height:650px;padding:30px 26px;}.resource-section{padding:20px;}}
@media(max-width:600px){.book-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;}.wrap{width:100%;margin:12px auto 24px;}#box{min-height:520px;padding:22px 14px;border-radius:16px;}.resource-section{padding:14px;margin:18px 0 22px;border-radius:14px;}}

.top{gap:14px}.top .profile-block{min-width:0}.top .profile-block b{font-size:22px;line-height:1.25;display:block}.top .profile-block small{font-size:13px;line-height:1.6}.top .profile-block small{text-transform:none;letter-spacing:0;color:#ffe0a0;font-size:11px;line-height:1.5}.top .top-actions{display:flex;align-items:center;gap:9px;margin-left:auto}.top .pw-toggle{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.35);box-shadow:none}.top .pw-toggle:hover{background:rgba(255,255,255,.18);box-shadow:none}
.pw-panel{display:none;margin:18px 0 0}.pw-panel.open{display:block}.pw-panel .panel{padding:22px}.pw-panel h2{margin-bottom:8px}
.resource-section{margin:24px 0 8px}.resource-section h2{font-size:25px;margin:0 0 12px;padding-bottom:8px;border-bottom:2px solid #e9eef0;color:#062847}.book-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:18px;margin:14px 0 26px}.book-card{min-width:0;background:#fff;border:1px solid #e3e9ec;border-radius:14px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 2px 8px rgba(6,40,71,.05);transition:transform .18s,box-shadow .18s}.book-card:hover{transform:translateY(-3px);box-shadow:0 12px 26px rgba(6,40,71,.12)}.book-cover{width:100%;aspect-ratio:3/4;background:linear-gradient(135deg,#edf2f4,#dfe8eb);display:flex;align-items:center;justify-content:center;overflow:hidden}.book-cover img{width:100%;height:100%;object-fit:cover}.book-cover .no-cover{font-size:14px;color:#667985;padding:15px;text-align:center}.book-info{padding:18px;display:flex;flex-direction:column;gap:7px;flex:1}.book-info h3{font-size:20px;line-height:1.45;margin:0;color:#102b4c;overflow-wrap:anywhere}.book-info p{font-size:14px;color:#687985;line-height:1.4;margin:0}.book-info a{margin-top:auto;display:inline-block;text-align:center;padding:11px 12px;border-radius:8px;background:#062847;color:white;font-size:15px;font-weight:800}.book-info a:hover{background:#167d78}.department-filter{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.department-filter button{border:1px solid #cbd8d7;background:#fff;border-radius:18px;padding:7px 13px;font:800 12px Manrope,Arial,sans-serif;cursor:pointer}.department-filter button.on{background:#167d78;color:#fff;border-color:#167d78}.empty-state{padding:22px;background:#f7f9fa;border:1px dashed #cbd8d7;border-radius:12px;color:#5b6b75}
.external-resource-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.external-resource-card{display:flex;flex-direction:column;gap:8px;padding:18px;background:#fff;border:1px solid #dce6eb;border-left:4px solid #167d78;border-radius:12px;text-decoration:none;transition:transform .2s,box-shadow .2s}
.external-resource-card:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(6,40,71,.1)}
.external-resource-card b{color:#062847;font-size:16px;overflow-wrap:anywhere}
.external-resource-card small{color:#167d78;font-weight:800;font-size:11px;letter-spacing:.7px}
.external-resource-card span{color:#5b6b75;font-size:13px}
@media(max-width:900px){.top{flex-wrap:wrap}.top .top-actions{gap:6px}}
@media(max-width:600px){.book-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.top{padding:10px 3%;gap:8px}.top img{width:38px;height:38px}.top .top-actions{width:100%;justify-content:flex-end}.top .top-actions a{margin-right:auto}.panel{padding:18px}}
.profile-editor{display:grid;grid-template-columns:130px 1fr;gap:22px;align-items:start;background:#f7fafb;border:1px solid #dce6eb;border-radius:18px;padding:22px;margin:22px 0 28px}.profile-photo{width:112px;height:112px;border-radius:50%;object-fit:cover;background:#e6edf0;border:3px solid #fff}.profile-photo-placeholder{width:112px;height:112px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#e6edf0;color:#567;font-size:13px;margin:auto}.profile-photo-wrap{text-align:center}.profile-fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.profile-fields label{display:block;font-size:12px;font-weight:800;color:#29475a;margin-bottom:5px}.profile-fields input{width:100%;box-sizing:border-box;padding:11px;border:1px solid #ccd9df;border-radius:9px;background:#fff}.profile-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px}.profile-message{font-size:13px;margin-top:10px}.profile-message.ok{color:#167d58}.profile-message.err{color:#b42318}@media(max-width:600px){.profile-editor{grid-template-columns:1fr}.profile-fields{grid-template-columns:1fr}.profile-photo-wrap{display:flex;align-items:center;gap:14px;text-align:left}}</style></head>
<body>
<div class="top"><img src="logo.jpg" alt="AIHS Library logo"><div class="profile-block"><b>AIHS Library</b><small id="profileInfo">Loading profile...</small></div><div class="top-actions"><a href="index.html" class="btn">Home</a><button type="button" class="pw-toggle" id="pwToggle">Change password</button><button class="out" id="out">Sign out</button></div></div>
<div class="wrap"><div class="panel" id="box">Loading...</div>
<div class="pw-panel" id="pwPanel"><div class="panel"><h2>Change password</h2><form id="pf"><div class="row"><div><label for="cp">Current password</label><input id="cp" type="password" required></div><div><label for="np">New password (min 6)</label><input id="np" type="password" minlength="6" required></div></div><p style="margin-top:14px"><button class="btn">Change password</button> <button type="button" class="btn" id="pwClose" style="background:#e9eef0;box-shadow:none">Close</button></p><p class="msg" id="pm"></p></form></div></div>
</div>
<script type="module">
import {auth,db,profile,go,signOut,onAuthStateChanged,collection,onSnapshot,esc,changePassword,doc,updateDoc,serverTimestamp} from "./fb.js";
const $=id=>document.getElementById(id);
$("out").onclick=async()=>{await signOut(auth);location.href="index.html";};
$("pwToggle").onclick=()=>{$("pwPanel").classList.toggle("open");if($("pwPanel").classList.contains("open"))$("cp").focus();};
$("pwClose").onclick=()=>{$("pwPanel").classList.remove("open");};
$("pf").onsubmit=async e=>{e.preventDefault();const m=$("pm");m.className="msg";m.textContent="";try{await changePassword($("cp").value,$("np").value);m.className="msg ok";m.textContent="Password changed successfully.";$("pf").reset();}catch(err){m.className="msg err";m.textContent=err.code==="auth/invalid-credential"||err.code==="auth/wrong-password"?"Current password is wrong.":"Could not change password: "+(err.code||err.message);}};
function driveImage(url){if(!url)return "";const s=String(url).trim();if(/^https?:\/\//i.test(s)&&!s.includes("drive.google.com"))return s;const m=s.match(/\/d\/([\w-]+)/)||s.match(/[?&]id=([\w-]+)/);return m?`https://drive.google.com/thumbnail?id=${m[1]}&sz=w800`:s;}
function driveFile(url){if(!url)return "";const s=String(url).trim();if(/^https:\/\//i.test(s))return s;const m=s.match(/[\w-]{20,}/);return m?`https://drive.google.com/file/d/${m[0]}/view`:"";}
onAuthStateChanged(auth,async u=>{
 if(!u){location.href="index.html";return;}
 const p=await profile(u);if(!p){location.href="register.html";return;}
 if(go(p)==="admin.html"){location.href="admin.html";return;}
 $("profileInfo").textContent="Name: "+(p.name||"—")+"  |  College ID / User ID: "+(p.idNo||"—");
 const b=$("box");
 if(p.status==="pending"){b.innerHTML="<h2>Waiting for approval</h2><p>Your registration is with the library admin. You can open resources once it is approved. Please check again later.</p><span class='badge pending'>Pending</span>";return;}
 if(p.status==="rejected"){b.innerHTML="<h2>Registration not approved</h2><p>Please contact the librarian: librarian@aihs.ac.in</p><span class='badge rejected'>Rejected</span>";return;}
 b.innerHTML="<h2 style='font-size:28px;line-height:1.25;margin-bottom:10px'>Welcome, "+esc(p.name||"Library Member")+"</h2><p style='margin:0 0 12px;color:#5b6b75'>"+esc(p.dept||"")+" · "+esc(p.cls||"")+"</p><section class='profile-editor'><div class='profile-photo-wrap'><img id='profilePhotoPreview' class='profile-photo' alt='Profile photo' hidden><div id='profilePhotoEmpty' class='profile-photo-placeholder'>No photo</div><label for='profilePhotoFile'>Change photo</label><input id='profilePhotoFile' type='file' accept='image/*' hidden></div><div><h3>My Profile</h3><form id='profileEditForm'><div class='profile-fields'><div><label>Full name</label><input id='editProfileName' maxlength='100' required></div><div><label>Email</label><input id='editProfileEmail' type='email' maxlength='150'></div><div><label>Department</label><input id='editProfileDept' maxlength='100'></div><div><label>Year / Class</label><input id='editProfileClass' maxlength='60'></div></div><div class='profile-actions'><button class='btn' type='submit'>Save profile</button><button class='btn' type='button' id='removeProfilePhoto'>Remove photo</button></div><p id='profileEditMessage' class='profile-message'></p></form></div></section><div class='tabs' id='ct'></div><input id='rq' placeholder='Search e-books, notes, question papers, journals' style='margin-bottom:6px'><div id='deptFilters' class='department-filter' style='display:none'></div><div id='resourceResults'></div><section class='resource-section' id='externalResourcePanel' hidden><h2>Journals &amp; Databases</h2><p style='color:#5b6b75;margin:0 0 14px'>Open the official website to explore and download available research articles.</p><div id='externalResourceResults' class='external-resource-list'></div></section>";
// Student/staff profile editor
 let profilePhotoData=p.photoData||"";
 const photoPreview=$("profilePhotoPreview"),photoEmpty=$("profilePhotoEmpty");
 function showProfilePhoto(value){profilePhotoData=value||"";if(profilePhotoData){photoPreview.src=profilePhotoData;photoPreview.hidden=false;photoEmpty.hidden=true;}else{photoPreview.removeAttribute("src");photoPreview.hidden=true;photoEmpty.hidden=false;}}
 $("editProfileName").value=p.name||"";$("editProfileEmail").value=p.email||"";$("editProfileDept").value=p.dept||"";$("editProfileClass").value=p.cls||"";showProfilePhoto(profilePhotoData);
 $("profilePhotoFile").onchange=async()=>{const file=$("profilePhotoFile").files[0];if(!file)return;const msg=$("profileEditMessage");if(!file.type.startsWith("image/")){msg.className="profile-message err";msg.textContent="ಚಿತ್ರದ ಫೈಲ್ ಆಯ್ಕೆಮಾಡಿ.";return;}if(file.size>5*1024*1024){msg.className="profile-message err";msg.textContent="ಚಿತ್ರದ ಗಾತ್ರ 5 MB ಗಿಂತ ಕಡಿಮೆ ಇರಬೇಕು.";return;}try{const data=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement("canvas");const scale=Math.min(1,480/Math.max(im.width,im.height));c.width=Math.round(im.width*scale);c.height=Math.round(im.height*scale);c.getContext("2d").drawImage(im,0,0,c.width,c.height);resolve(c.toDataURL("image/jpeg",.76));};im.onerror=reject;im.src=reader.result;};reader.onerror=reject;reader.readAsDataURL(file);});showProfilePhoto(data);msg.textContent="ಚಿತ್ರ ಆಯ್ಕೆಮಾಡಲಾಗಿದೆ. Save profile ಒತ್ತಿ."; }catch(err){msg.textContent="ಚಿತ್ರವನ್ನು ತೆರೆಯಲು ಸಾಧ್ಯವಾಗಲಿಲ್ಲ.";msg.className="profile-message err";}};
 $("removeProfilePhoto").onclick=()=>{showProfilePhoto("");$("profilePhotoFile").value="";$("profileEditMessage").textContent="ಚಿತ್ರ ತೆಗೆದುಹಾಕಲಾಗಿದೆ. Save profile ಒತ್ತಿ.";};
 $("profileEditForm").onsubmit=async e=>{e.preventDefault();const msg=$("profileEditMessage");msg.className="profile-message";msg.textContent="ಉಳಿಸಲಾಗುತ್ತಿದೆ...";const d={name:$("editProfileName").value.trim(),email:$("editProfileEmail").value.trim(),dept:$("editProfileDept").value.trim(),cls:$("editProfileClass").value.trim(),photoData:profilePhotoData,profileUpdatedAt:serverTimestamp()};if(!d.name){msg.className="profile-message err";msg.textContent="ಹೆಸರನ್ನು ನಮೂದಿಸಿ.";return;}try{await updateDoc(doc(db,"users",u.uid),d);Object.assign(p,d);$("profileInfo").textContent="Name: "+p.name+" | College ID / User ID: "+(p.idNo||"—");b.querySelector("h2").textContent="Welcome, "+p.name;b.querySelector("h2").nextElementSibling.textContent=(p.dept||"")+" · "+(p.cls||"");msg.className="profile-message ok";msg.textContent="Profile ಯಶಸ್ವಿಯಾಗಿ ಉಳಿಸಲಾಗಿದೆ.";}catch(err){console.error(err);msg.className="profile-message err";msg.textContent="Profile ಉಳಿಸಲಾಗಲಿಲ್ಲ: "+(err.code||err.message)+". Firestore Rules ಪರಿಶೀಲಿಸಿ.";}}; const CATS=["E-Books","Study Notes","Question Papers","Journals & Databases"];let cat="E-Books",list=[],links={},externalResources=[],deptChoice="All departments";
 function getDept(r){return String(r.dept||"Other departments").trim()||"Other departments";}
 function resourceLink(r){return driveFile(r.link||r.pdfLink||links[r.id]||"");}
 function coverLink(r){return driveImage(r.coverLink||r.coverURL||r.cover||"");}
 function card(r){const l=resourceLink(r),cover=coverLink(r),d=document.createElement("article");d.className="book-card";const visual=document.createElement("div");visual.className="book-cover";if(cover){const im=document.createElement("img");im.src=cover;im.alt=r.title||"Book cover";im.loading="lazy";im.onerror=()=>{visual.innerHTML="<div class='no-cover'>Cover image unavailable</div>";};visual.appendChild(im);}else visual.innerHTML="<div class='no-cover'>Cover page not added</div>";const info=document.createElement("div");info.className="book-info";const h=document.createElement("h3");h.textContent=r.title||"Untitled resource";const meta=document.createElement("p");meta.textContent=getDept(r)+(r.cls?" · "+r.cls:"");info.append(h,meta);if(l){const a=document.createElement("a");a.href=l;a.target="_blank";a.rel="noopener";a.textContent="Open / Read";info.appendChild(a);}d.append(visual,info);return d;}
 function draw(){
  const ct=$("ct");ct.innerHTML="";
  CATS.forEach(c=>{const x=document.createElement("button");x.textContent=c;x.className=c===cat?"on":"";x.onclick=()=>{cat=c;deptChoice="All departments";draw();drawExternalResources();};ct.appendChild(x);});
  const results=$("resourceResults"),df=$("deptFilters");
  if(cat==="Journals & Databases"){results.innerHTML="";df.style.display="none";df.innerHTML="";drawExternalResources();return;}
  const q=$("rq").value.toLowerCase();
  const v=list.filter(r=>{
   const category=String(r.category||"").trim().toLowerCase();
   const wanted=cat.toLowerCase();
   return category===wanted && ((r.title||"")+" "+(r.desc||"")+" "+(r.dept||"")+" "+(r.cls||"")).toLowerCase().includes(q);
  }).sort((a,b)=>(a.title||"").localeCompare(b.title||""));
  results.innerHTML="";
  const depts=[...new Set(v.map(getDept))].sort((a,b)=>a.localeCompare(b));
  df.style.display=depts.length?"flex":"none";df.innerHTML="";
  ["All departments",...depts.filter(d=>d!=="All departments")].forEach(dep=>{
   const btn=document.createElement("button");btn.textContent=dep;btn.className=deptChoice===dep?"on":"";btn.onclick=()=>{deptChoice=dep;draw();};df.appendChild(btn);
  });
  const selected=deptChoice==="All departments"?v:v.filter(r=>getDept(r)===deptChoice);
  const groups=deptChoice==="All departments"?depts:[deptChoice];
  if(!selected.length){results.innerHTML="<div class='empty-state'>ಈ ವಿಭಾಗದಲ್ಲಿ "+cat+" ಲಭ್ಯವಿಲ್ಲ.</div>";return;}
  groups.forEach(dep=>{
   const items=selected.filter(r=>getDept(r)===dep);if(!items.length)return;
   const sec=document.createElement("section");sec.className="resource-section";
   const title=document.createElement("h2");title.textContent=dep;
   const grid=document.createElement("div");grid.className="book-grid";
   items.forEach(r=>grid.appendChild(card(r)));
   sec.append(title,grid);results.appendChild(sec);
  });
 }
 $("rq").oninput=draw;
 function drawExternalResources(){
  const panel=$("externalResourcePanel"),target=$("externalResourceResults");
  target.innerHTML="";
  const q=$("rq").value.trim().toLowerCase();
  const shown=externalResources.filter(x=>(x.title+" "+(x.type||"")).toLowerCase().includes(q));
  panel.hidden=cat!=="Journals & Databases";
  if(cat==="Journals & Databases"&&!shown.length){target.innerHTML="<div class='empty-state'>No journals or databases found.</div>";return;}
  shown.forEach(item=>{
   const a=document.createElement("a");a.className="external-resource-card";a.href=item.url;a.target="_blank";a.rel="noopener noreferrer";
   const type=document.createElement("small");type.textContent=item.type==="Database"?"DATABASE":"JOURNAL";
   const title=document.createElement("b");title.textContent=item.title;
   const open=document.createElement("span");open.textContent="Open official website ↗";
   a.append(type,title,open);target.appendChild(a);
  });
 }
 $("rq").addEventListener("input",drawExternalResources);
 onSnapshot(collection(db,"externalResources"),s=>{
  externalResources=s.docs.map(d=>({id:d.id,...d.data()}))
   .filter(x=>x.title && /^https?:\/\//i.test(x.url||""))
   .sort((a,b)=>(a.type||"").localeCompare(b.type||"") || a.title.localeCompare(b.title));
  drawExternalResources();
 },err=>{
  console.error("Journals / Databases loading error:",err);
  $("externalResourcePanel").hidden=false;
  $("externalResourceResults").innerHTML="<div class='empty-state'>Journals and databases could not be loaded. Please contact the librarian.</div>";
 });
 onSnapshot(collection(db,"resources"),s=>{list=s.docs.map(d=>({id:d.id,...d.data()}));draw();},err=>{console.error(err);$("resourceResults").innerHTML="<div class='empty-state'>Resources could not be loaded. Please contact the librarian.</div>";});
 onSnapshot(collection(db,"resourceLinks"),s=>{links={};s.docs.forEach(d=>{links[d.id]=d.data().link;});draw();},err=>console.warn("Resource links unavailable",err));
});
</script></body></html>
